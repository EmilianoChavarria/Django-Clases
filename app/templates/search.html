<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Fondo claro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .logo {
            width: 300px;
            margin-bottom: 20px;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/1200px-Google_2015_logo.svg.png" alt="Google Logo" class="logo">

    <div class="search-container">
        <form method="GET" class="input-group">
            <input 
                type="text" 
                name="q" 
                value="{{ query }}" 
                class="form-control" 
                placeholder="Buscar en Google">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
    </div>

    <div class="mt-4 search-container">
        {% if results %}
            <ul class="list-group">
                {% for item in results %}
                    <li class="list-group-item">
                        <a href="{{ item.link }}" class="fw-bold text-decoration-none">{{ item.title }}</a>
                        <p class="mb-0 text-muted">{{ item.snippet }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
