<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Lista de productos con promesa</h1>
    <div id="productos" style="display: flex; flex-direction: column;">

    </div>
    <script>

        const fetchData = async () => {
            let productosDiv = document.getElementById('productos');
            try {
                const result = await fetch('http://127.0.0.1:8000/productos/api/get/');
                const objeto = await result.json();
                objeto.forEach(element => {
                    productosDiv.innerHTML += `<span>${element.nombre}</span>
                    <span>${element.precio}</span>
                    <img src="${element.imagen}" alt="" style="height: 100px; width: 300px">`
                    console.log(element)
                });

            } catch (error) {
                console.log(error)
            }

            // console.log(objeto);
        }
        fetchData()

    </script>
</body>

</html>
