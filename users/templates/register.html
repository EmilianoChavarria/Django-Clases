<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 500px;">
        <h2 class="text-center mb-4">Registrarse</h2>
        <form method="post" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_name" class="form-label">Nombre</label>
                    {{ form.name }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="id_surname" class="form-label">Apellido</label>
                    {{ form.surname }}
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_email" class="form-label">Correo</label>
                    {{ form.email }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="id_control_number" class="form-label">Matrícula</label>
                    {{ form.control_number }}
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_age" class="form-label">Edad</label>
                    {{ form.age }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="id_tel" class="form-label">Teléfono</label>
                    {{ form.tel }}
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_password1" class="form-label">Contraseña</label>
                    {{ form.password1 }}
                </div>
                <div class="col-md-6 mb-3">
                    <label for="id_password2" class="form-label">Confirmar contraseña</label>
                    {{ form.password2 }}
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">Registrarse</button>
        </form>
    </div>
    {% include 'message.html' %}
    <script>
        function validateForm() {
            let password1 = document.getElementById("id_password1").value;
            let password2 = document.getElementById("id_password2").value;

            if (password1.length < 8) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "La contraseña debe tener al menos 8 caracteres.",
                    confirmButtonColor: "#d33"
                });
                return false;
            }

            if (password1 !== password2) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "Las contraseñas no coinciden.",
                    confirmButtonColor: "#d33"
                });
                return false;
            }

            const regex_numero = /[0-9]/;
            if (!regex_numero.test(password1)) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "La contraseña debe tener al menos 1 número.",
                    confirmButtonColor: "#d33"
                });
                return false;
            }

            const regex_mayuscula = /[A-Z]/;
            if (!regex_mayuscula.test(password1)) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "La contraseña debe tener al menos 1 mayúscula.",
                    confirmButtonColor: "#d33"
                });
                return false;
            }

            const regex_simbolo = /[!#$%&?]/;
            if (!regex_simbolo.test(password1)) {
                Swal.fire({
                    icon: "error",
                    title: "Error",
                    text: "La contraseña debe tener al menos 1 símbolo.",
                    confirmButtonColor: "#d33"
                });
                return false;
            }

            return true;
        }



    </script>
</body>



</html>
